services:
  # SafeWatch Frontend Static Site
  - type: web
    name: safewatch-mission-control
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # SafeWatch AI Vision & SocketIO Backend
  - type: web
    name: safewatch-backend-engine
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: BACKEND_PORT
        value: 5000
